{% extends 'base.html' %}


{% block title %}
Login - Toko Buku
{% endblock %}


{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm">

                <div class="card-header text-center">

                    <h4 class="mb-0">
                        Login
                    </h4>

                </div>


                <div class="card-body">

                    {% if messages %}

                        {% for message in messages %}

                            <div class="alert alert-info">

                                {{ message }}

                            </div>

                        {% endfor %}

                    {% endif %}


                    <form method="POST">

                        {% csrf_token %}


                        <!-- USERNAME -->

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required
                            >

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-4">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Login
                        </button>

                    </form>


                    <div class="text-center mt-4">

                        <p class="mb-0">

                            Belum punya akun?

                            <a
                                href="{% url 'accounts:register' %}"
                            >
                                Daftar sekarang
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

{% load static %}

<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        Toko Buku
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>

<body>

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="{% url 'books:home' %}"
        >
            📚 Toko Buku
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            id="navbarNav"
        >

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{% url 'books:home' %}"
                    >
                        Home
                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{% url 'books:book_list' %}"
                    >
                        📚 Buku
                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="/orders/cart/"
                    >
                        🛒 Keranjang
                    </a>

                </li>

                {% if user.is_authenticated %}

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{% url 'accounts:profile' %}"
                        >
                            👤 {{ user.username }}
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link text-warning"
                            href="{% url 'accounts:logout' %}"
                        >
                            Logout
                        </a>

                    </li>

                {% else %}

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{% url 'accounts:login' %}"
                        >
                            Login
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{% url 'accounts:register' %}"
                        >
                            Register
                        </a>

                    </li>

                {% endif %}

            </ul>

        </div>

    </div>

</nav>


<main>

    {% block content %}
    {% endblock %}

</main>


<footer class="bg-dark text-white mt-5">

    <div class="container py-4 text-center">

        <p class="mb-0">
            © 2026 Toko Buku
        </p>

    </div>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
